[package]
name = "rss-manager"
version = "0.1.0"
edition = "2021"
description = "Self-hosted Web RSS manager (Axum + SQLite FTS5 + Lit SPA)"
license = "MIT"

[[bin]]
name = "rss-manager"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit", "catch-panic", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset"] }
feed-rs = { version = "2", features = ["sanitize"] }
ammonia = "4"
url = "2"
readabilityrs = "0.1.4"
quick-xml = "0.36"
scraper = "0.20"
thiserror = "1"
anyhow = "1"
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
